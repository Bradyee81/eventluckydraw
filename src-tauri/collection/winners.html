<!doctype html>
<!-- Collection point page, served by Lucky Draw at http://<laptop>:3000/winners.
     Self-contained: the venue WiFi may have no internet. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prize Collection</title>
<style>
  :root { --bg:#10141F; --card:#1A2030; --line:#2A3246; --text:#F3F4F6; --dim:#9AA3B5; --gold:#F5C518; --green:#7CD992; --red:#E27676; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:16px/1.35 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  header { position:sticky; top:0; z-index:1; background:var(--bg); border-bottom:1px solid var(--line); padding:12px 16px 10px; }
  h1 { margin:0; font-size:20px; display:flex; align-items:center; gap:10px; }
  #live { font-size:12px; font-weight:600; padding:2px 8px; border-radius:999px; background:#1E3A2A; color:var(--green); }
  #live.off { background:#3A1E22; color:var(--red); }
  #stats { color:var(--dim); font-size:14px; margin-top:2px; }
  #search { width:100%; margin-top:10px; padding:10px 12px; font-size:16px; border-radius:8px; border:1px solid var(--line); background:var(--card); color:var(--text); outline:none; }
  #search:focus { border-color:var(--gold); }
  .chips { display:flex; gap:6px; margin-top:8px; overflow-x:auto; padding-bottom:2px; }
  .chip { flex:none; padding:6px 12px; border-radius:999px; border:1px solid var(--line); background:none; color:var(--dim); font-size:14px; }
  .chip.on { background:var(--gold); border-color:var(--gold); color:#10141F; font-weight:600; }
  main { padding:10px 16px 40px; }
  .card { display:flex; align-items:center; gap:12px; background:var(--card); border:1px solid var(--line); border-radius:10px; padding:10px 12px; margin-bottom:8px; }
  .card.new { animation:flash 3s ease-out; }
  @keyframes flash { from { border-color:var(--gold); box-shadow:0 0 0 2px var(--gold); } to { border-color:var(--line); box-shadow:none; } }
  .card.done { opacity:.5; }
  .num { flex:none; min-width:64px; font:700 24px/1 ui-monospace, Consolas, monospace; color:var(--gold); text-align:center; }
  .info { flex:1; min-width:0; }
  .name { font-weight:600; font-size:17px; overflow-wrap:anywhere; }
  .prize { color:var(--text); font-size:14px; margin-top:2px; overflow-wrap:anywhere; }
  .tag { display:inline-block; font-size:11px; font-weight:700; color:var(--gold); border:1px solid rgba(245,197,24,.45); border-radius:4px; padding:0 4px; margin-right:6px; }
  .section { color:var(--dim); font-size:12px; margin-top:2px; }
  .btn { flex:none; min-width:96px; padding:10px 8px; border-radius:8px; font-size:14px; font-weight:600; border:1px solid var(--gold); background:var(--gold); color:#10141F; }
  .card.done .btn { background:none; border-color:var(--green); color:var(--green); }
  .empty { color:var(--dim); text-align:center; padding:40px 0; }
</style>
</head>
<body>
<header>
  <h1>Prize Collection <span id="live">Live</span></h1>
  <div id="stats">Connecting…</div>
  <input id="search" type="search" inputmode="search" placeholder="Search number or name" autocomplete="off">
  <div class="chips" id="status-chips">
    <button class="chip on" data-status="todo">To collect</button>
    <button class="chip" data-status="done">Collected</button>
    <button class="chip" data-status="all">All</button>
  </div>
  <div class="chips" id="section-chips"></div>
</header>
<main id="list"></main>
<script>
  const POLL_MS = 2000;
  let winners = [];
  let seen = null;           // ids already shown, to flash new winners
  let status = "todo";
  let section = "";
  // Taps not yet reflected by the laptop, so the card doesn't flicker back.
  const pending = new Map();

  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]));
  const collected = (w) => pending.has(w.id) ? pending.get(w.id) : w.collected;

  async function poll() {
    try {
      const res = await fetch("/winners.json", { cache: "no-store" });
      const data = await res.json();
      winners = data.winners || [];
      for (const w of winners) if (pending.get(w.id) === w.collected) pending.delete(w.id);
      $("live").textContent = "Live";
      $("live").className = "";
      render();
    } catch {
      $("live").textContent = "Can't reach laptop";
      $("live").className = "off";
    }
  }

  function render() {
    const done = winners.filter(collected).length;
    $("stats").textContent = `${done} of ${winners.length} prize${winners.length === 1 ? "" : "s"} collected`;

    const sections = [...new Set(winners.map((w) => w.section))];
    $("section-chips").innerHTML = sections.length < 2 ? "" :
      [["", "All draws"], ...sections.map((s) => [s, s])]
        .map(([v, label]) => `<button class="chip${v === section ? " on" : ""}" data-section="${esc(v)}">${esc(label)}</button>`).join("");

    const q = $("search").value.trim().toLowerCase();
    const shown = winners.filter((w) =>
      (status === "all" || (status === "done") === collected(w)) &&
      (!section || w.section === section) &&
      (!q || w.number.toLowerCase().includes(q) || w.name.toLowerCase().includes(q)));

    const fresh = seen ? winners.filter((w) => !seen.has(w.id)).map((w) => w.id) : [];
    seen = new Set(winners.map((w) => w.id));

    $("list").innerHTML = shown.length === 0
      ? `<div class="empty">${winners.length === 0 ? "No winners drawn yet." : "Nothing here."}</div>`
      : shown.map((w) => `
        <div class="card${collected(w) ? " done" : ""}${fresh.includes(w.id) ? " new" : ""}">
          <div class="num">${esc(w.number)}</div>
          <div class="info">
            <div class="name">${esc(w.name || "—")}</div>
            <div class="prize">${w.group ? `<span class="tag">${esc(w.group)}</span>` : ""}${esc(w.prize || "—")}</div>
            <div class="section">${esc(w.section)}</div>
          </div>
          <button class="btn" data-id="${w.id}">${collected(w) ? "✓ Collected" : "Collected"}</button>
        </div>`).join("");
  }

  async function toggle(id) {
    const w = winners.find((x) => x.id === id);
    if (!w) return;
    const next = !collected(w);
    if (!next && !confirm(`Mark ${w.number} ${w.name} as NOT collected?`)) return;
    pending.set(id, next);
    render();
    try {
      await fetch("/winners/collect", { method: "POST", body: JSON.stringify({ id, collected: next }) });
    } catch {
      pending.delete(id);
      alert("Couldn't reach the laptop. Check this phone is on the same WiFi.");
      render();
    }
  }

  $("list").addEventListener("click", (e) => {
    const btn = e.target.closest(".btn");
    if (btn) toggle(Number(btn.dataset.id));
  });
  $("status-chips").addEventListener("click", (e) => {
    const chip = e.target.closest(".chip");
    if (!chip) return;
    status = chip.dataset.status;
    for (const c of $("status-chips").children) c.classList.toggle("on", c === chip);
    render();
  });
  $("section-chips").addEventListener("click", (e) => {
    const chip = e.target.closest(".chip");
    if (!chip) return;
    section = chip.dataset.section;
    render();
  });
  $("search").addEventListener("input", render);

  poll();
  setInterval(poll, POLL_MS);
</script>
</body>
</html>
