# Builds the Windows installer and publishes it as a GitHub Release.
# The release also carries latest.json, which installed copies of the app
# read to discover updates.
#
# To ship a new version: bump "version" in package.json (and src-tauri/Cargo.toml),
# update release-notes.md (shown in the app under "What's new"), commit, push,
# then run this workflow from the Actions tab, or push a tag like v0.3.0.
name: Release

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            src-tauri -> target
            ESP32 Buzzer/flash-tool -> target

      - run: npm ci

      - id: notes
        shell: bash
        run: |
          {
            echo "body<<NOTES_EOF"
            cat release-notes.md
            echo "NOTES_EOF"
          } >> "$GITHUB_OUTPUT"

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: Lucky Draw v__VERSION__
          releaseBody: ${{ steps.notes.outputs.body }}
          releaseDraft: false
          prerelease: false
